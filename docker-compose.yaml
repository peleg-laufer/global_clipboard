services:
  clip_api:
    depends_on:
      clip_db:
        condition: service_healthy
    build:
      restart: unless-stopped
      context: .
      dockerfile: Dockerfile
    environment:
      - FILES_PATH=/data/files
      - CONNECTION_STRING=mongodb://clip_db:27017/
    ports:
      - "8000:8000"
    volumes:
      - files-folder:/data/files
  clip_db:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  files-folder:
  mongo-data:
